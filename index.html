function normalize(v) {
  return String(v || "")
    .replace(/\s+/g, "")
    .toUpperCase();
}

function isHeaderLike(v) {
  const t = String(v || "").trim();
  return /^(ch[aâ]ssis|n[°o]?\s*ch[aâ]ssis|numero\s*ch[aâ]ssis|num\s*ch[aâ]ssis|vin|chassis\s*n[°o]?)$/i.test(
    t

}

function buildMap(list) {
  const map = new Map();
  list.forEach((v) => {
    const norm = normalize(v);
    if (norm) map.set(norm, String(v).trim());
  });
  return map;
}

function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}

function formatElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toCSV(rows) {
  const esc = (s) => `"${String(s).replace(/"/g, '""')}"`;
  return "Châssis\n" + rows.map((r) => esc(r)).join("\n");
}

// --- Retour sonore discret (bip synthétisé, sans fichier externe) ---
let audioCtx = null;
function playTone(freq, duration = 0.12, type = "sine") {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {
    // audio non disponible, on ignore silencieusement
  }
}
function playFeedbackSound(type) {
  if (type === "found") playTone(880, 0.13);
  else if (type === "registered") playTone(660, 0.13);
  else if (type === "duplicate") {
    playTone(520, 0.08);
    setTimeout(() => playTone(520, 0.08), 110);
  } else if (type === "notfound") playTone(220, 0.22, "square");
}

function InventaireMMTE() {
  const [phase, setPhase] = useState("setup"); // setup | inventory | summary
  const [parcName, setParcName] = useState("");
  const [invDate, setInvDate] = useState(todayISO());
  const [importMode, setImportMode] = useState("file"); // file | paste
  const [pasteText, setPasteText] = useState("");
  const [importError, setImportError] = useState("");
  const [importedFileName, setImportedFileName] = useState("");

  const [mmteMap, setMmteMap] = useState(new Map());
  const [foundList, setFoundList] = useState([]); // {norm, chassis, time}
  const [registeredList, setRegisteredList] = useState([]); // {norm, chassis, time}
  const [inputVal, setInputVal] = useState("");
  const [feedback, setFeedback] = useState(null); // {type, chassis, message}
  const [pendingNotFound, setPendingNotFound] = useState(null); // {norm, chassis}
  const [activeTab, setActiveTab] = useState("total");
  const [listFilter, setListFilter] = useState("");
  const [stampAnim, setStampAnim] = useState(null); // 'found' | 'registered'
  const [resumeSession, setResumeSession] = useState(null);
  const [confirmNewParc, setConfirmNewParc] = useState(false);
  const [soundOn, setSoundOn] = useState(true);
  const [startedAt, setStartedAt] = useState(null);
  const [now, setNow] = useState(Date.now());

  const inputRef = useRef(null);
  const stampTimeout = useRef(null);

  const foundSet = useMemo(() => new Set(foundList.map((f) => f.norm)), [foundList]);
  const registeredSet = useMemo(
    () => new Set(registeredList.map((r) => r.norm)),
    [registeredList]
  );

  const missingList = useMemo(() => {
    const out = [];
    mmteMap.forEach((chassis, norm) => {
      if (!foundSet.has(norm)) out.push({ norm, chassis });
    });
    return out;
  }, [mmteMap, foundSet]);

  const totalList = useMemo(() => {
    return [
      ...foundList.map((f) => ({ ...f, source: "MMTE" })),
      ...registeredList.map((r) => ({ ...r, source: "Parc" })),
    ].sort((a, b) => a.time - b.time);
  }, [foundList, registeredList]);

  const progressPct = useMemo(() => {
    if (mmteMap.size === 0) return 0;
    return Math.min(100, Math.round((foundList.length / mmteMap.size) * 100));
  }, [foundList.length, mmteMap.size]);

  // Chronomètre d'inventaire
  useEffect(() => {
    if (phase !== "inventory") return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [phase]);

  // Recherche d'une session à reprendre au démarrage
  useEffect(() => {
    (async () => {
      try {
        const res = storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && parsed.parcName) setResumeSession(parsed);
        }
      } catch (e) {
        // aucune session enregistrée
      }
    })();
  }, []);

  // Sauvegarde continue pendant l'inventaire
  useEffect(() => {
    if (phase === "setup") return;
    const session = {
      parcName,
      invDate,
      mmteEntries: Array.from(mmteMap.entries()),
      foundList,
      registeredList,
      startedAt,
      savedAt: Date.now(),
    };
    (async () => {
      try {
        storage.set(STORAGE_KEY, JSON.stringify(session));
      } catch (e) {
        // silencieux : la saisie continue même si la sauvegarde échoue
      }
    })();
  }, [phase, parcName, invDate, mmteMap, foundList, registeredList, startedAt]);

  const applyImportedList = (rawValues) => {
    const cleaned = rawValues
      .map((v) => String(v).trim())
      .filter(Boolean)
      .filter((v) => !isHeaderLike(v));
    if (cleaned.length === 0) {
      setImportError("Aucun numéro de châssis détecté. Vérifiez le fichier ou le texte collé.");
      return;
    }
    const map = buildMap(cleaned);
    const duplicateCount = cleaned.length - map.size;
    setMmteMap(map);
    setImportError(
      duplicateCount > 0
        ? `${duplicateCount} doublon(s) détecté(s) dans la liste et ignoré(s) (${map.size} châssis uniques conservés).`
        : ""
    );
  };

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportedFileName(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
        const values = rows.map((r) => (r && r[0] !== undefined ? String(r[0]) : "")).filter(Boolean);
        applyImportedList(values);
      } catch (err) {
        setImportError("Impossible de lire ce fichier. Formats acceptés : CSV, XLS, XLSX.");
      }
    };
    reader.onerror = () => setImportError("Échec de la lecture du fichier.");
    reader.readAsArrayBuffer(file);
  };

  const handleLoadPaste = () => {
    const lines = pasteText.split(/\r?\n/);
    applyImportedList(lines);
  };

  const canStart = parcName.trim().length > 0 && invDate && mmteMap.size > 0;

  const startInventory = () => {
    setFoundList([]);
    setRegisteredList([]);
    setFeedback(null);
    setPendingNotFound(null);
    setStartedAt(Date.now());
    setPhase("inventory");
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
  };

  const resume = () => {
    if (!resumeSession) return;
    setParcName(resumeSession.parcName);
    setInvDate(resumeSession.invDate);
    setMmteMap(new Map(resumeSession.mmteEntries));
    setFoundList(resumeSession.foundList || []);
    setRegisteredList(resumeSession.registeredList || []);
    setStartedAt(resumeSession.startedAt || Date.now());
    setResumeSession(null);
    setPhase("inventory");
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
  };

  const dismissResume = async () => {
    setResumeSession(null);
    try {
      storage.delete(STORAGE_KEY);
    } catch (e) {
      // ignore
    }
  };

  const triggerStamp = (kind) => {
    setStampAnim(kind);
    if (stampTimeout.current) clearTimeout(stampTimeout.current);
    stampTimeout.current = setTimeout(() => setStampAnim(null), 650);
  };

  const submitChassis = () => {
    const raw = inputVal.trim();
    if (!raw) return;
    const norm = normalize(raw);

    if (mmteMap.has(norm)) {
      if (foundSet.has(norm)) {
        setFeedback({ type: "duplicate", chassis: raw, message: "Déjà pointé comme trouvé sur MMTE." });
        if (soundOn) playFeedbackSound("duplicate");
      } else {
        const original = mmteMap.get(norm);
        setFoundList((prev) => [...prev, { norm, chassis: original, time: Date.now() }]);
        setFeedback({ type: "found", chassis: original, message: "Trouvé sur MMTE." });
        triggerStamp("found");
        if (soundOn) playFeedbackSound("found");
      }
      setPendingNotFound(null);
    } else if (registeredSet.has(norm)) {
      setFeedback({
        type: "duplicate",
        chassis: raw,
        message: "Déjà enregistré comme présent sur le parc (hors MMTE).",
      });
      if (soundOn) playFeedbackSound("duplicate");
      setPendingNotFound(null);
    } else {
      setPendingNotFound({ norm, chassis: raw });
      setFeedback({ type: "notfound", chassis: raw, message: "Introuvable sur la liste MMTE." });
      if (soundOn) playFeedbackSound("notfound");
    }
    setInputVal("");
    inputRef.current && inputRef.current.focus();
  };

  const confirmRegister = () => {
    if (!pendingNotFound) return;
    setRegisteredList((prev) => [
      ...prev,
      { norm: pendingNotFound.norm, chassis: pendingNotFound.chassis, time: Date.now() },
    ]);
    setFeedback({
      type: "registered",
      chassis: pendingNotFound.chassis,
      message: "Enregistré comme présent sur le parc.",
    });
    setPendingNotFound(null);
    triggerStamp("registered");
    if (soundOn) playFeedbackSound("registered");
    inputRef.current && inputRef.current.focus();
  };

  const cancelPending = () => {
    setPendingNotFound(null);
    setFeedback(null);
    inputRef.current && inputRef.current.focus();
  };

  const removeFound = (norm) => setFoundList((prev) => prev.filter((f) => f.norm !== norm));
  const removeRegistered = (norm) => setRegisteredList((prev) => prev.filter((r) => r.norm !== norm));

  const resetAll = async () => {
    setPhase("setup");
    setParcName("");
    setInvDate(todayISO());
    setMmteMap(new Map());
    setFoundList([]);
    setRegisteredList([]);
    setPasteText("");
    setImportedFileName("");
    setFeedback(null);
    setPendingNotFound(null);
    setConfirmNewParc(false);
    setStartedAt(null);
    try {
      storage.delete(STORAGE_KEY);
    } catch (e) {
      // ignore
    }
  };

  const exportCSVList = (kind) => {
    let rows = [];
    let name = "";
    if (kind === "found") {
      rows = foundList.map((f) => f.chassis);
      name = "trouves_MMTE";
    } else if (kind === "registered") {
      rows = registeredList.map((r) => r.chassis);
      name = "enregistres_parc";
    } else if (kind === "total") {
      rows = totalList.map((t) => t.chassis);
      name = "total_parc";
    } else if (kind === "missing") {
      rows = missingList.map((m) => m.chassis);
      name = "manquants_MMTE";
    }
    downloadBlob(
      `${name}_${parcName || "parc"}_${invDate}.csv`,
      toCSV(rows),
      "text/csv;charset=utf-8"
    );
  };

  const exportExcel = () => {
    const wb = XLSX.utils.book_new();
    const summary = [
      ["INVENTAIRE MMTE — Bénin Control / MAD-MAE"],
      [],
      ["Parc", parcName],
      ["Date de l'inventaire", invDate],
      ["Châssis attendus (MMTE)", mmteMap.size],
      ["Trouvés sur MMTE", foundList.length],
      ["Enregistrés (présents sur le parc, absents MMTE)", registeredList.length],
      ["Total présent sur le parc", totalList.length],
      ["Manquants (sur MMTE, absents du parc)", missingList.length],
      [],
      ["Conception", "Nourou Dine LOKA"],
    ];
    wb.SheetNames.push("Résumé");
    wb.Sheets["Résumé"] = XLSX.utils.aoa_to_sheet(summary);

    const addSheet = (name, rows) => {
      const aoa = [["Châssis"], ...rows.map((r) => [r])];
      wb.SheetNames.push(name);
      wb.Sheets[name] = XLSX.utils.aoa_to_sheet(aoa);
    };
    addSheet("Trouvés MMTE", foundList.map((f) => f.chassis));
    addSheet("Enregistrés Parc", registeredList.map((r) => r.chassis));
    addSheet("Total Parc", totalList.map((t) => t.chassis));
    addSheet("Manquants MMTE", missingList.map((m) => m.chassis));

    XLSX.writeFile(wb, `Inventaire_${parcName || "parc"}_${invDate}.xlsx`);
  };

  const feedbackStyle = {
    found: { bg: "bg-emerald-50", border: "border-emerald-300", text: "text-emerald-800", Icon: CheckCircle2 },
    registered: { bg: "bg-blue-50", border: "border-blue-300", text: "text-blue-800", Icon: CheckCircle2 },
    duplicate: { bg: "bg-amber-50", border: "border-amber-300", text: "text-amber-800", Icon: AlertTriangle },
    notfound: { bg: "bg-rose-50", border: "border-rose-300", text: "text-rose-800", Icon: XCircle },
  };

  return (
    <div className="min-h-screen w-full bg-white" style={{ fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
        .font-plex-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
        @keyframes stampIn {
          0% { opacity: 0; transform: scale(1.6) rotate(-16deg); }
          40% { opacity: 1; transform: scale(0.95) rotate(-10deg); }
          100% { opacity: 0; transform: scale(1) rotate(-10deg); }
        }
        .stamp-anim { animation: stampIn 0.65s ease-out forwards; }
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block !important; }
        }
        .print-only { display: none; }
      `}</style>

      <AppHeader phase={phase} />

      {phase === "setup" && (
        <SetupScreen
          parcName={parcName}
          setParcName={setParcName}
          invDate={invDate}
          setInvDate={setInvDate}
          importMode={importMode}
          setImportMode={setImportMode}
          pasteText={pasteText}
          setPasteText={setPasteText}
          handleFileChange={handleFileChange}
          handleLoadPaste={handleLoadPaste}
          importError={importError}
          importedFileName={importedFileName}
          mmteSize={mmteMap.size}
          canStart={canStart}
          startInventory={startInventory}
          resumeSession={resumeSession}
          resume={resume}
          dismissResume={dismissResume}
        />
      )}

      {phase === "inventory" && (
        <InventoryScreen
          parcName={parcName}
          invDate={invDate}
          mmteSize={mmteMap.size}
          foundList={foundList}
          registeredList={registeredList}
          totalList={totalList}
          missingList={missingList}
          inputVal={inputVal}
          setInputVal={setInputVal}
          inputRef={inputRef}
          submitChassis={submitChassis}
          feedback={feedback}
          feedbackStyle={feedbackStyle}
          pendingNotFound={pendingNotFound}
          confirmRegister={confirmRegister}
          cancelPending={cancelPending}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          listFilter={listFilter}
          setListFilter={setListFilter}
          removeFound={removeFound}
          removeRegistered={removeRegistered}
          stampAnim={stampAnim}
          confirmNewParc={confirmNewParc}
          setConfirmNewParc={setConfirmNewParc}
          resetAll={resetAll}
          goSummary={() => setPhase("summary")}
          progressPct={progressPct}
          elapsed={startedAt ? formatElapsed(now - startedAt) : "00:00"}
          soundOn={soundOn}
          setSoundOn={setSoundOn}
        />
      )}

      {phase === "summary" && (
        <SummaryScreen
          parcName={parcName}
          invDate={invDate}
          mmteSize={mmteMap.size}
          foundList={foundList}
          registeredList={registeredList}
          totalList={totalList}
          missingList={missingList}
          exportCSVList={exportCSVList}
          exportExcel={exportExcel}
          backToInventory={() => setPhase("inventory")}
          resetAll={resetAll}
        />
      )}

      <AppFooter />
    </div>
  );
}

      <div className="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between gap-3">
        <img src={LOGO_BC} alt="Bénin Control" className="h-12 sm:h-14 w-auto object-contain shrink-0" />

              >
                Choisir un fichier
                <input type="file" accept=".csv,.xlsx,.xls" className="hidden" onChange={handleFileChange} />
              </label>
              {importedFileName && (
                <p className="text-xs text-slate-500 mt-2">Fichier chargé : {importedFileName}</p>
              )}
            </div>
          ) : (
            <div>
              <textarea
                value={pasteText}
                onChange={(e) => setPasteText(e.target.value)}
                placeholder={"Collez la liste des châssis, un par ligne\nEx :\nVF1AB23C456789012\nWDB1234567A123456"}
                rows={6}
                className="w-full rounded-lg border-2 border-slate-200 px-3 py-3 text-sm font-plex-mono focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
              />
              <button
                onClick={handleLoadPaste}
                className="mt-2 px-4 py-2 rounded-lg text-white font-bold text-sm"
                style={{ background: BLUE_DEEP }}
              >
                Charger la liste collée
              </button>
            </div>
          )}

          {importError && <p className="text-sm text-rose-600 mt-2 font-semibold">{importError}</p>}
          {mmteSize > 0 && (
            <div className="mt-3 inline-flex items-center gap-2 text-emerald-700 bg-emerald-50 border-2 border-emerald-200 rounded-lg px-3 py-2 text-sm font-bold">
              <CheckCircle2 size={16} /> {mmteSize} châssis chargés depuis MMTE
            </div>
          )}
        </div>

        <button
          disabled={!canStart}
          onClick={startInventory}
          className={`w-full py-4 rounded-xl font-extrabold text-base flex items-center justify-center gap-2 transition ${
            canStart ? "text-white shadow-md" : "bg-slate-200 text-slate-400"
          }`}
          style={canStart ? { background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` } : undefined}
        >
          <ScanLine size={20} /> Démarrer l'inventaire de ce parc
        </button>
      </div>
    </div>
  );
}

function InventoryScreen(props) {
  const {
    parcName,
    invDate,
    mmteSize,
    foundList,
    registeredList,
    totalList,
    missingList,
    inputVal,
    setInputVal,
    inputRef,
    submitChassis,
    feedback,
    feedbackStyle,
    pendingNotFound,
    confirmRegister,
    cancelPending,
    activeTab,
    setActiveTab,
    listFilter,
    setListFilter,
    removeFound,
    removeRegistered,
    stampAnim,
    confirmNewParc,
    setConfirmNewParc,
    resetAll,
    goSummary,
    progressPct,
    elapsed,
    soundOn,
    setSoundOn,
  } = props;

  const tabs = [
    { key: "total", label: `Total (${totalList.length})` },
    { key: "found", label: `Trouvés MMTE (${foundList.length})` },
    { key: "registered", label: `Enregistrés (${registeredList.length})` },
    { key: "missing", label: `Manquants (${missingList.length})` },
  ];

  const filterFn = (chassis) =>
    !listFilter || chassis.toUpperCase().includes(listFilter.trim().toUpperCase());

  return (
    <div className="max-w-2xl mx-auto px-4 py-5 pb-24 relative">
      <div className="flex items-center justify-between mb-1">
        <div>
          <div className="text-xs uppercase tracking-wide text-slate-500 font-semibold">{invDate}</div>
          <h2 className="text-xl font-extrabold" style={{ color: BLUE_DEEP }}>
            {parcName}
          </h2>
        </div>
        <div className="flex items-center gap-3">
          <button
            onClick={() => setSoundOn((s) => !s)}
            title={soundOn ? "Couper le son" : "Activer le son"}
            className="text-slate-400 hover:text-[#1B4F8C] p-1.5"
          >
            {soundOn ? <Volume2 size={18} /> : <VolumeX size={18} />}
          </button>
          <button
            onClick={() => setConfirmNewParc(true)}
            className="text-sm font-bold text-slate-500 flex items-center gap-1"
          >
            <RotateCcw size={16} /> Nouveau parc
          </button>
        </div>
      </div>

      <div className="flex items-center gap-1.5 text-xs text-slate-400 font-semibold mb-4">
        <Clock size={13} /> Durée de l'inventaire : {elapsed}
      </div>

      {confirmNewParc && (
        <div className="mb-4 rounded-xl border-2 border-rose-300 bg-rose-50 p-4">
          <div className="font-bold text-rose-900">
            Démarrer un nouvel inventaire effacera les pointages en cours pour {parcName}.
          </div>
          <div className="flex gap-3 mt-3">
            <button
              onClick={resetAll}
              className="px-4 py-2 rounded-lg bg-rose-600 text-white font-bold text-sm"
            >
              Oui, repartir à zéro
            </button>
            <button
              onClick={() => setConfirmNewParc(false)}
              className="px-4 py-2 rounded-lg bg-white border-2 border-rose-300 text-rose-800 font-semibold text-sm"
            >
              Annuler
            </button>
          </div>
        </div>
      )}

      <div className="mb-4">
        <div className="flex justify-between text-xs font-bold text-slate-500 mb-1">
          <span>Progression MMTE</span>
          <span>{progressPct}%</span>
        </div>
        <div className="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
          <div
            className="h-full rounded-full transition-all duration-500"
            style={{ width: `${progressPct}%`, background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` }}
          />
        </div>
      </div>

      <div className="flex gap-2 overflow-x-auto pb-1 mb-5">
        <StatChip label="Attendus MMTE" value={mmteSize} tone="navy" />
        <StatChip label="Trouvés MMTE" value={foundList.length} tone="emerald" />
        <StatChip label="Enregistrés" value={registeredList.length} tone="sky" />
        <StatChip label="Total présent" value={totalList.length} tone="navy" />
        <StatChip label="Manquants" value={missingList.length} tone="rose" />
      </div>

      <div className="bg-white rounded-2xl border-2 border-[#1B4F8C]/15 shadow-sm p-4 relative overflow-hidden">
        {stampAnim && (
          <div className="pointer-events-none absolute inset-0 flex items-center justify-center z-10">
            <div
              className={`stamp-anim border-4 rounded-full px-6 py-3 font-black uppercase tracking-widest text-lg ${
                stampAnim === "found" ? "border-emerald-600 text-emerald-600" : "border-[#2E7DC1] text-[#2E7DC1]"
              }`}
            >
              {stampAnim === "found" ? "Trouvé MMTE" : "Enregistré"}
            </div>
          </div>
        )}

        <label className="block text-sm font-bold text-slate-700 mb-2">Numéro de châssis</label>
        <input
          ref={inputRef}
          value={inputVal}
          onChange={(e) => setInputVal(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") submitChassis();
          }}
          autoCapitalize="characters"
          autoCorrect="off"
          autoComplete="off"
          spellCheck={false}
          placeholder="Saisir ou scanner le châssis"
          className="w-full rounded-xl border-2 border-slate-300 px-4 py-4 text-2xl font-plex-mono tracking-wide focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
        />
        <button
          onClick={submitChassis}
          className="w-full mt-3 py-4 rounded-xl text-white font-extrabold text-base shadow-md"
          style={{ background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` }}
        >
          Valider
        </button>

        {feedback && !pendingNotFound && (
          <div
            className={`mt-4 rounded-xl border-2 p-3 flex items-start gap-2 ${feedbackStyle[feedback.type].bg} ${
              feedbackStyle[feedback.type].border
            }`}
          >
            {React.createElement(feedbackStyle[feedback.type].Icon, {
              size: 20,
              className: feedbackStyle[feedback.type].text,
            })}
            <div>
              <div className={`font-bold font-plex-mono ${feedbackStyle[feedback.type].text}`}>
                {feedback.chassis}
              </div>
              <div className={`text-sm font-medium ${feedbackStyle[feedback.type].text}`}>{feedback.message}</div>
            </div>
          </div>
        )}

        {pendingNotFound && (
          <div className="mt-4 rounded-xl border-2 border-rose-300 bg-rose-50 p-3">
            <div className="flex items-start gap-2">
              <XCircle size={20} className="text-rose-700 shrink-0" />
              <div>
                <div className="font-bold font-plex-mono text-rose-800">{pendingNotFound.chassis}</div>
                <div className="text-sm font-medium text-rose-700">Introuvable sur la liste MMTE.</div>
              </div>
            </div>
            <div className="flex gap-3 mt-3">
              <button
                onClick={confirmRegister}
                className="flex-1 py-3 rounded-lg text-white font-bold text-sm"
                style={{ background: BLUE }}
              >
                Enregistrer présent sur le parc
              </button>
              <button
                onClick={cancelPending}
                className="px-4 py-3 rounded-lg bg-white border-2 border-slate-300 text-slate-600 font-bold text-sm"
              >
                Annuler
              </button>
            </div>
          </div>
        )}
      </div>

      <div className="mt-6">
        <div className="flex gap-1 overflow-x-auto border-b-2 border-slate-100 mb-3">
          {tabs.map((t) => (
            <button
              key={t.key}
              onClick={() => setActiveTab(t.key)}
              className="px-3 py-2 text-sm font-bold whitespace-nowrap border-b-2"
              style={
                activeTab === t.key
                  ? { borderColor: BLUE_DEEP, color: BLUE_DEEP }
                  : { borderColor: "transparent", color: "#94a3b8" }
              }
            >
              {t.label}
            </button>
          ))}
        </div>

        <div className="relative mb-3">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input
            value={listFilter}
            onChange={(e) => setListFilter(e.target.value)}
            placeholder="Filtrer par numéro de châssis..."
            className="w-full pl-9 pr-3 py-2 text-sm rounded-lg border-2 border-slate-200 font-plex-mono focus:outline-none focus:border-[#1B4F8C]"
          />
        </div>

        <div className="space-y-2 max-h-[36vh] overflow-y-auto">
          {activeTab === "total" &&
            (totalList.filter((t) => filterFn(t.chassis)).length === 0 ? (
              <EmptyRow text="Aucun véhicule pointé pour l'instant." />
            ) : (
              totalList
                .filter((t) => filterFn(t.chassis))
                .map((t) => (
                  <ListRow
                    key={t.norm}
                    chassis={t.chassis}
                    badge={t.source === "MMTE" ? "MMTE" : "Parc"}
                    badgeTone={t.source === "MMTE" ? "emerald" : "sky"}
                  />
                ))
            ))}

          {activeTab === "found" &&
            (foundList.filter((f) => filterFn(f.chassis)).length === 0 ? (
              <EmptyRow text="Aucun châssis trouvé sur MMTE pour l'instant." />
            ) : (
              foundList
                .filter((f) => filterFn(f.chassis))
                .map((f) => <ListRow key={f.norm} chassis={f.chassis} onRemove={() => removeFound(f.norm)} />)
            ))}

          {activeTab === "registered" &&
            (registeredList.filter((r) => filterFn(r.chassis)).length === 0 ? (
              <EmptyRow text="Aucun châssis enregistré hors MMTE pour l'instant." />
            ) : (
              registeredList
                .filter((r) => filterFn(r.chassis))
                .map((r) => (
                  <ListRow key={r.norm} chassis={r.chassis} onRemove={() => removeRegistered(r.norm)} />
                ))
            ))}

          {activeTab === "missing" &&
            (missingList.filter((m) => filterFn(m.chassis)).length === 0 ? (
              <EmptyRow text="Tous les châssis MMTE ont été retrouvés sur le parc." />
            ) : (
              missingList
                .filter((m) => filterFn(m.chassis))
                .map((m) => <ListRow key={m.norm} chassis={m.chassis} badge="Absent" badgeTone="rose" />)
            ))}
        </div>
      </div>

      <div className="no-print fixed bottom-0 left-0 right-0 bg-white border-t-2 border-[#1B4F8C]/15 p-3">
        <div className="max-w-2xl mx-auto">
          <button
            onClick={goSummary}
            className="w-full py-3 rounded-xl text-white font-extrabold flex items-center justify-center gap-2 shadow-md"
            style={{ background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` }}
          >
            <ListChecks size={18} /> Terminer et voir le récapitulatif
          </button>
        </div>
      </div>
    </div>
  );
}

function ListRow({ chassis, onRemove, badge, badgeTone }) {
  const tones = {
    emerald: "bg-emerald-100 text-emerald-700",
    sky: "bg-blue-100 text-[#1B4F8C]",
    rose: "bg-rose-100 text-rose-700",
  };
  return (
    <div className="flex items-center justify-between bg-white border-2 border-slate-100 rounded-lg px-3 py-2">
      <span className="font-plex-mono text-sm font-medium text-slate-800">{chassis}</span>
      <div className="flex items-center gap-2">
        {badge && (
          <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${tones[badgeTone]}`}>{badge}</span>
        )}
        {onRemove && (
          <button onClick={onRemove} className="text-slate-400 hover:text-rose-600 p-1">
            <Trash2 size={16} />
          </button>
        )}
      </div>
    </div>
  );
}

function EmptyRow({ text }) {
  return <div className="text-sm text-slate-400 text-center py-6">{text}</div>;
}

function SummaryScreen({
  parcName,
  invDate,
  mmteSize,
  foundList,
  registeredList,
  totalList,
  missingList,
  exportCSVList,
  exportExcel,
  backToInventory,
  resetAll,
}) {
  return (
    <div className="max-w-2xl mx-auto px-5 py-8">
      <button
        onClick={backToInventory}
        className="no-print flex items-center gap-1 text-sm font-bold text-slate-500 mb-4"
      >
        <ArrowLeft size={16} /> Retour au pointage
      </button>

      <div className="text-xs uppercase tracking-[0.2em] font-bold mb-1" style={{ color: BLUE_LIGHT }}>
        Récapitulatif d'inventaire
      </div>
      <h1 className="text-2xl font-extrabold mb-1" style={{ color: BLUE_DEEP }}>
        {parcName}
      </h1>
      <p className="text-slate-500 mb-6 font-medium">{invDate}</p>

      <div className="grid grid-cols-2 gap-3 mb-6">
        <SummaryCard label="Attendus sur MMTE" value={mmteSize} tone="navy" />
        <SummaryCard label="Trouvés sur MMTE" value={foundList.length} tone="emerald" />
        <SummaryCard label="Enregistrés (hors MMTE)" value={registeredList.length} tone="sky" />
        <SummaryCard label="Total présent sur le parc" value={totalList.length} tone="navy" />
        <SummaryCard label="Manquants (sur MMTE, absents)" value={missingList.length} tone="rose" full />
      </div>

      <div className="no-print bg-white rounded-2xl border-2 border-[#1B4F8C]/15 shadow-sm p-5 space-y-3">
        <div className="font-bold text-slate-700 mb-1">Exporter les résultats</div>
        <button
          onClick={exportExcel}
          className="w-full py-3 rounded-lg text-white font-bold text-sm flex items-center justify-center gap-2"
          style={{ background: BLUE_DEEP }}
        >
          <Download size={16} /> Télécharger le classeur Excel complet (4 feuilles + résumé)
        </button>
        <button
          onClick={() => window.print()}
          className="w-full py-3 rounded-lg border-2 text-sm font-bold flex items-center justify-center gap-2"
          style={{ borderColor: BLUE_LIGHT, color: BLUE_DEEP }}
        >
          <Printer size={16} /> Imprimer / générer un PDF du rapport
        </button>
        <div className="grid grid-cols-2 gap-2 pt-2">
          <button
            onClick={() => exportCSVList("total")}
            className="py-2.5 rounded-lg border-2 border-slate-200 text-sm font-bold text-slate-700"
          >
            CSV — Total parc
          </button>
          <button
            onClick={() => exportCSVList("found")}
            className="py-2.5 rounded-lg border-2 border-slate-200 text-sm font-bold text-slate-700"
          >
            CSV — Trouvés MMTE
          </button>
          <button
            onClick={() => exportCSVList("registered")}
            className="py-2.5 rounded-lg border-2 border-slate-200 text-sm font-bold text-slate-700"
          >
            CSV — Enregistrés
          </button>
          <button
            onClick={() => exportCSVList("missing")}
            className="py-2.5 rounded-lg border-2 border-slate-200 text-sm font-bold text-slate-700"
          >
            CSV — Manquants
          </button>
        </div>
      </div>

      <button
        onClick={resetAll}
        className="no-print w-full mt-6 py-3 rounded-xl text-white font-extrabold flex items-center justify-center gap-2 shadow-md"
        style={{ background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` }}
      >
        <RotateCcw size={18} /> Passer au parc suivant
      </button>

      {/* Rapport imprimable */}
      <div className="print-only mt-8">
        <div className="border-t-2 border-slate-300 pt-4 mb-4">
          <p className="text-xs text-slate-500">Rapport généré le {new Date().toLocaleString("fr-FR")}</p>
        </div>
        <ReportTable title="Trouvés sur MMTE" rows={foundList.map((f) => f.chassis)} />
        <ReportTable title="Enregistrés sur le parc (hors MMTE)" rows={registeredList.map((r) => r.chassis)} />
        <ReportTable title="Manquants (attendus sur MMTE, absents du parc)" rows={missingList.map((m) => m.chassis)} />
        <p className="text-xs text-slate-400 mt-6">Conception &amp; réalisation : Nourou Dine LOKA — Bénin Control / MAD-MAE</p>
      </div>
    </div>
  );
}

function ReportTable({ title, rows }) {
  if (rows.length === 0) return null;
  return (
    <div className="mb-6 break-inside-avoid">
      <h3 className="font-bold text-sm mb-2" style={{ color: BLUE_DEEP }}>
        {title} ({rows.length})
      </h3>
      <div className="grid grid-cols-2 gap-x-6 gap-y-1 text-xs font-plex-mono">
        {rows.map((r, i) => (
          <div key={i} className="border-b border-slate-100 py-0.5">
            {r}
          </div>
        ))}
      </div>
    </div>
  );
}

function SummaryCard({ label, value, tone, full }) {
  const tones = {
    navy: "text-white",
    emerald: "bg-emerald-600 text-white",
    sky: "bg-[#2E7DC1] text-white",
    rose: "bg-rose-600 text-white",
  };
  const style = tone === "navy" ? { background: BLUE_DEEP } : undefined;
  return (
    <div className={`rounded-xl p-4 ${tones[tone]} ${full ? "col-span-2" : ""}`} style={style}>
      <div className="text-3xl font-extrabold font-plex-mono leading-none">{value}</div>
      <div className="text-xs uppercase tracking-wide opacity-90 mt-1 font-semibold">{label}</div>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(<InventaireMMTE />);
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
