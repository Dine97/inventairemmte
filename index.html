function agentDisplayName(user) {
  if (!user) return "";

  return user.displayName || user.email || "Utilisateur";
}

function normalize(v) {
  return String(v || "")
    .replace(/\s+/g, "")
    .toUpperCase();
}

function isHeaderLike(v) {
  const t = String(v || "").trim();
  return /^(ch[aâ]ssis|n[°o]?\s*ch[aâ]ssis|numero\s*ch[aâ]ssis|num\s*ch[aâ]ssis|vin|chassis\s*n[°o]?)$/i.test(
    t
  );
}

function buildMap(list) {
  const map = new Map();
  list.forEach((v) => {
    const norm = normalize(v);
    if (norm) map.set(norm, String(v).trim());
  });
  return map;
}

function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}

function formatElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toCSV(headers, rows) {
  const esc = (s) => `"${String(s == null ? "" : s).replace(/"/g, '""')}"`;
  const lines = [headers.map(esc).join(","), ...rows.map((r) => r.map(esc).join(","))];
  return lines.join("\n");
}

// --- Retour sonore discret (bip synthétisé, sans fichier externe) ---
let audioCtx = null;
function playTone(freq, duration = 0.12, type = "sine") {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {
    // audio non disponible, on ignore silencieusement
  }
}
function playFeedbackSound(type) {
  if (type === "found") playTone(880, 0.13);
  else if (type === "registered") playTone(660, 0.13);
  else if (type === "duplicate") {
    playTone(520, 0.08);
    setTimeout(() => playTone(520, 0.08), 110);
  } else if (type === "notfound") playTone(220, 0.22, "square");
}

function loadSavedSession() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.phase && parsed.phase !== "setup") return parsed;
    return null;
  } catch (e) {
    return null;
  }
}

function InventaireMMTE() {
  // undefined = état encore inconnu (Firebase vérifie la session en cours),
  // null = déconnecté, objet User Firebase = connecté (compte ou invité).
  const [authUser, setAuthUser] = useState(undefined);
  const currentAgent = authUser ? { name: agentDisplayName(authUser) } : null;

  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((user) => setAuthUser(user));
    return unsubscribe;
  }, []);

  // Chargée une seule fois, de façon synchrone, pour restaurer une session
  // interrompue (ex : actualisation accidentelle de la page) sans aucun délai.
  const [savedSession] = useState(loadSavedSession);

  const [phase, setPhase] = useState(() => (savedSession ? savedSession.phase : "setup")); // setup | inventory | summary
  const [parcName, setParcName] = useState(() => (savedSession ? savedSession.parcName || "" : ""));
  const [invDate, setInvDate] = useState(() => (savedSession ? savedSession.invDate || todayISO() : todayISO()));
  const [importMode, setImportMode] = useState("file"); // file | paste
  const [pasteText, setPasteText] = useState("");
  const [importError, setImportError] = useState("");
  const [importedFileName, setImportedFileName] = useState("");

  const [mmteMap, setMmteMap] = useState(() =>
    savedSession ? new Map(savedSession.mmteEntries || []) : new Map()
  );
  const [foundList, setFoundList] = useState(() => (savedSession ? savedSession.foundList || [] : [])); // {norm, chassis, time}
  const [registeredList, setRegisteredList] = useState(() =>
    savedSession ? savedSession.registeredList || [] : []
  ); // {norm, chassis, time}
  const [inputVal, setInputVal] = useState("");
  const [feedback, setFeedback] = useState(null); // {type, chassis, message}
  const [pendingNotFound, setPendingNotFound] = useState(null); // {norm, chassis}
  const [activeTab, setActiveTab] = useState("total");
  const [listFilter, setListFilter] = useState("");
  const [stampAnim, setStampAnim] = useState(null); // 'found' | 'registered'
  const [restoredBanner, setRestoredBanner] = useState(!!savedSession);
  const [confirmNewParc, setConfirmNewParc] = useState(false);
  const [soundOn, setSoundOn] = useState(true);
  const [startedAt, setStartedAt] = useState(() => (savedSession ? savedSession.startedAt || Date.now() : null));
  const [now, setNow] = useState(Date.now());

  const inputRef = useRef(null);
  const stampTimeout = useRef(null);

  const foundSet = useMemo(() => new Set(foundList.map((f) => f.norm)), [foundList]);
  const registeredSet = useMemo(
    () => new Set(registeredList.map((r) => r.norm)),
    [registeredList]
  );

  const missingList = useMemo(() => {
    const out = [];
    mmteMap.forEach((chassis, norm) => {
      if (!foundSet.has(norm)) out.push({ norm, chassis });
    });
    return out;
  }, [mmteMap, foundSet]);

  const totalList = useMemo(() => {
    return [
      ...foundList.map((f) => ({ ...f, source: "MMTE" })),
      ...registeredList.map((r) => ({ ...r, source: "Parc" })),
    ].sort((a, b) => a.time - b.time);
  }, [foundList, registeredList]);

  const progressPct = useMemo(() => {
    if (mmteMap.size === 0) return 0;
    return Math.min(100, Math.round((foundList.length / mmteMap.size) * 100));
  }, [foundList.length, mmteMap.size]);

  // Chronomètre d'inventaire
  useEffect(() => {
    if (phase !== "inventory") return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [phase]);

  // Sauvegarde continue pendant l'inventaire (localStorage : synchrone, survit
  // aux actualisations de page et aux fermetures accidentelles du navigateur)
  useEffect(() => {
    if (phase === "setup") {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        // ignore
      }
      return;
    }
    const session = {
      phase,
      parcName,
      invDate,
      mmteEntries: Array.from(mmteMap.entries()),
      foundList,
      registeredList,
      startedAt,
      savedAt: Date.now(),
    };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
    } catch (e) {
      // silencieux : la saisie continue même si la sauvegarde échoue (ex : stockage plein)
    }
  }, [phase, parcName, invDate, mmteMap, foundList, registeredList, startedAt]);

  // Avertit avant une fermeture/actualisation accidentelle pendant un inventaire actif
  useEffect(() => {
    const handler = (e) => {
      if (phase === "setup") return;
      e.preventDefault();
      e.returnValue = "";
    };
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, [phase]);

  const applyImportedList = (rawValues) => {
    const cleaned = rawValues
      .map((v) => String(v).trim())
      .filter(Boolean)
      .filter((v) => !isHeaderLike(v));
    if (cleaned.length === 0) {
      setImportError("Aucun numéro de châssis détecté. Vérifiez le fichier ou le texte collé.");
      return;
    }
    setMmteMap(buildMap(cleaned));
    setImportError("");
  };

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportedFileName(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
        const values = rows.map((r) => (r && r[0] !== undefined ? String(r[0]) : "")).filter(Boolean);
        applyImportedList(values);
      } catch (err) {
        setImportError("Impossible de lire ce fichier. Formats acceptés : CSV, XLS, XLSX.");
      }
    };
    reader.onerror = () => setImportError("Échec de la lecture du fichier.");
    reader.readAsArrayBuffer(file);
  };

  const handleLoadPaste = () => {
    const lines = pasteText.split(/\r?\n/);
    applyImportedList(lines);
  };

  const canStart = parcName.trim().length > 0 && invDate && mmteMap.size > 0;

  const startInventory = () => {
    setFoundList([]);
    setRegisteredList([]);
    setFeedback(null);
    setPendingNotFound(null);
    setStartedAt(Date.now());
    setPhase("inventory");
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
  };

  const triggerStamp = (kind) => {
    setStampAnim(kind);
    if (stampTimeout.current) clearTimeout(stampTimeout.current);
    stampTimeout.current = setTimeout(() => setStampAnim(null), 650);
  };

  const submitChassis = () => {
    const raw = inputVal.trim();
    if (!raw) return;
    const norm = normalize(raw);

    if (mmteMap.has(norm)) {
      if (foundSet.has(norm)) {
        setFeedback({ type: "duplicate", chassis: raw, message: "Déjà pointé comme trouvé sur MMTE." });
        if (soundOn) playFeedbackSound("duplicate");
      } else {
        const original = mmteMap.get(norm);
        setFoundList((prev) => [
          ...prev,
          { norm, chassis: original, time: Date.now(), agent: currentAgent ? currentAgent.name : "" },
        ]);
        setFeedback({ type: "found", chassis: original, message: "Trouvé sur MMTE." });
        triggerStamp("found");
        if (soundOn) playFeedbackSound("found");
      }
      setPendingNotFound(null);
    } else if (registeredSet.has(norm)) {
      setFeedback({
        type: "duplicate",
        chassis: raw,
        message: "Déjà enregistré comme présent sur le parc (hors MMTE).",
      });
      if (soundOn) playFeedbackSound("duplicate");
      setPendingNotFound(null);
    } else {
      setPendingNotFound({ norm, chassis: raw });
      setFeedback({ type: "notfound", chassis: raw, message: "Introuvable sur la liste MMTE." });
      if (soundOn) playFeedbackSound("notfound");
    }
    setInputVal("");
    inputRef.current && inputRef.current.focus();
  };

  const confirmRegister = () => {
    if (!pendingNotFound) return;
    setRegisteredList((prev) => [
      ...prev,
      {
        norm: pendingNotFound.norm,
        chassis: pendingNotFound.chassis,
        time: Date.now(),
        agent: currentAgent ? currentAgent.name : "",
      },
    ]);
    setFeedback({
      type: "registered",
      chassis: pendingNotFound.chassis,
      message: "Enregistré comme présent sur le parc.",
    });
    setPendingNotFound(null);
    triggerStamp("registered");
    if (soundOn) playFeedbackSound("registered");
    inputRef.current && inputRef.current.focus();
  };

  const cancelPending = () => {
    setPendingNotFound(null);
    setFeedback(null);
    inputRef.current && inputRef.current.focus();
  };

  const removeFound = (norm) => setFoundList((prev) => prev.filter((f) => f.norm !== norm));
  const removeRegistered = (norm) => setRegisteredList((prev) => prev.filter((r) => r.norm !== norm));

  const handleEmailLogin = (email, password) => auth.signInWithEmailAndPassword(email, password);

  const handleSignup = async (email, password, displayName) => {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    if (displayName) {
      await cred.user.updateProfile({ displayName });
      // Force le rafraîchissement de l'état pour refléter le nom immédiatement
      setAuthUser({ ...auth.currentUser });
    }
    try {
      await cred.user.sendEmailVerification();
    } catch (e) {
      // non bloquant
    }
    return cred;
  };

  const handleGuestAccess = () => auth.signInAnonymously();

  const handlePasswordReset = (email) => auth.sendPasswordResetEmail(email);

  const handleLogout = () => auth.signOut();

  const resetAll = () => {
    setPhase("setup");
    setParcName("");
    setInvDate(todayISO());
    setMmteMap(new Map());
    setFoundList([]);
    setRegisteredList([]);
    setPasteText("");
    setImportedFileName("");
    setFeedback(null);
    setPendingNotFound(null);
    setConfirmNewParc(false);
    setStartedAt(null);
    setRestoredBanner(false);
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      // ignore
    }
  };

  const exportCSVList = (kind) => {
    let rows = [];
    let name = "";
    if (kind === "found") {
      rows = foundList.map((f) => [f.chassis, f.agent || ""]);
      name = "trouves_MMTE";
    } else if (kind === "registered") {
      rows = registeredList.map((r) => [r.chassis, r.agent || ""]);
      name = "enregistres_parc";
    } else if (kind === "total") {
      rows = totalList.map((t) => [t.chassis, t.agent || ""]);
      name = "total_parc";
    } else if (kind === "missing") {
      rows = missingList.map((m) => [m.chassis, ""]);
      name = "manquants_MMTE";
    }
    downloadBlob(
      `${name}_${parcName || "parc"}_${invDate}.csv`,
      toCSV(["Châssis", "Agent"], rows),
      "text/csv;charset=utf-8"
    );
  };

  const exportExcel = () => {
    const wb = XLSX.utils.book_new();
    const summary = [
      ["INVENTAIRE MMTE — Bénin Control / MAD-MAE"],
      [],
      ["Parc", parcName],
      ["Date de l'inventaire", invDate],
      ["Agent connecté", currentAgent ? currentAgent.name : ""],
      ["Châssis attendus (MMTE)", mmteMap.size],
      ["Trouvés sur MMTE", foundList.length],
      ["Enregistrés (présents sur le parc, absents MMTE)", registeredList.length],
      ["Total présent sur le parc", totalList.length],
      ["Manquants (sur MMTE, absents du parc)", missingList.length],
      [],
      ["Conception", "Nourou Dine LOKA"],
    ];
    wb.SheetNames.push("Résumé");
    wb.Sheets["Résumé"] = XLSX.utils.aoa_to_sheet(summary);

    const addSheet = (name, rows) => {
      const aoa = [["Châssis", "Agent"], ...rows.map((r) => [r.chassis, r.agent || ""])];
      wb.SheetNames.push(name);
      wb.Sheets[name] = XLSX.utils.aoa_to_sheet(aoa);
    };
    addSheet("Trouvés MMTE", foundList);
    addSheet("Enregistrés Parc", registeredList);
    addSheet("Total Parc", totalList);
    addSheet(
      "Manquants MMTE",
      missingList.map((m) => ({ chassis: m.chassis, agent: "" }))
    );

    XLSX.writeFile(wb, `Inventaire_${parcName || "parc"}_${invDate}.xlsx`);
  };

  const feedbackStyle = {
    found: { bg: "bg-emerald-50", border: "border-emerald-300", text: "text-emerald-800", Icon: CheckCircle2 },
    registered: { bg: "bg-blue-50", border: "border-blue-300", text: "text-blue-800", Icon: CheckCircle2 },
    duplicate: { bg: "bg-amber-50", border: "border-amber-300", text: "text-amber-800", Icon: AlertTriangle },
    notfound: { bg: "bg-rose-50", border: "border-rose-300", text: "text-rose-800", Icon: XCircle },
  };

  return (
    <div className="min-h-screen w-full bg-white" style={{ fontFamily: "'IBM Plex Sans', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
        .font-plex-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
        @keyframes stampIn {
          0% { opacity: 0; transform: scale(1.6) rotate(-16deg); }
          40% { opacity: 1; transform: scale(0.95) rotate(-10deg); }
          100% { opacity: 0; transform: scale(1) rotate(-10deg); }
        }
        .stamp-anim { animation: stampIn 0.65s ease-out forwards; }
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block !important; }
        }
        .print-only { display: none; }
      `}</style>

      <AppHeader phase={phase} currentAgent={currentAgent} onLogout={handleLogout} />

      {authUser === undefined && (
        <div className="max-w-sm mx-auto px-5 py-16 text-center text-slate-400 text-sm">
          Chargement...
        </div>
      )}

      {authUser === null && (
        <LoginScreen
          onLogin={handleEmailLogin}
          onSignup={handleSignup}
          onGuest={handleGuestAccess}
          onReset={handlePasswordReset}
        />
      )}

      {currentAgent && phase === "setup" && (
        <SetupScreen
          parcName={parcName}
          setParcName={setParcName}
          invDate={invDate}
          setInvDate={setInvDate}
          importMode={importMode}
          setImportMode={setImportMode}
          pasteText={pasteText}
          setPasteText={setPasteText}
          handleFileChange={handleFileChange}
          handleLoadPaste={handleLoadPaste}
          importError={importError}
          importedFileName={importedFileName}
          mmteSize={mmteMap.size}
          canStart={canStart}
          startInventory={startInventory}
        />
      )}

      {currentAgent && phase === "inventory" && (
        <InventoryScreen
          parcName={parcName}
          invDate={invDate}
          mmteSize={mmteMap.size}
          foundList={foundList}
          registeredList={registeredList}
          totalList={totalList}
          missingList={missingList}
          inputVal={inputVal}
          setInputVal={setInputVal}
          inputRef={inputRef}
          submitChassis={submitChassis}
          feedback={feedback}
          feedbackStyle={feedbackStyle}
          pendingNotFound={pendingNotFound}
          confirmRegister={confirmRegister}
          cancelPending={cancelPending}
          activeTab={activeTab}
          setActiveTab={setActiveTab}
          listFilter={listFilter}
          setListFilter={setListFilter}
          removeFound={removeFound}
          removeRegistered={removeRegistered}
          stampAnim={stampAnim}
          confirmNewParc={confirmNewParc}
          setConfirmNewParc={setConfirmNewParc}
          resetAll={resetAll}
          goSummary={() => setPhase("summary")}
          progressPct={progressPct}
          elapsed={startedAt ? formatElapsed(now - startedAt) : "00:00"}
          soundOn={soundOn}
          setSoundOn={setSoundOn}
          restoredBanner={restoredBanner}
          setRestoredBanner={setRestoredBanner}
        />
      )}

      {currentAgent && phase === "summary" && (
        <SummaryScreen
          parcName={parcName}
          invDate={invDate}
          mmteSize={mmteMap.size}
          foundList={foundList}
          registeredList={registeredList}
          totalList={totalList}
          missingList={missingList}
          exportCSVList={exportCSVList}
          exportExcel={exportExcel}
          backToInventory={() => setPhase("inventory")}
          resetAll={resetAll}
        />
      )}

      <AppFooter />
    </div>
  );
}

function LoginScreen({ onLogin, onSignup, onGuest, onReset }) {
  const [mode, setMode] = useState("login"); // login | signup | reset
  const [displayName, setDisplayName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  const switchMode = (m) => {
    setMode(m);
    setError("");
    setInfo("");
  };

  const handleSubmit = async (e) => {
    if (e) e.preventDefault();
    setError("");
    setInfo("");

    if (mode === "login") {
      if (!email.trim() || !password) {
        setError("Merci de renseigner l'e-mail et le mot de passe.");
        return;
      }
      setBusy(true);
      try {
        await onLogin(email.trim(), password);
      } catch (err) {
        setError(friendlyAuthError(err));
      } finally {
        setBusy(false);
      }
    } else if (mode === "signup") {
      if (!displayName.trim() || !email.trim() || !password) {
        setError("Merci de remplir tous les champs.");
        return;
      }
      if (password.length < 6) {
        setError("Le mot de passe doit contenir au moins 6 caractères.");
        return;
      }
      if (password !== confirmPassword) {
        setError("Les deux mots de passe ne correspondent pas.");
        return;
      }
      setBusy(true);
      try {
        await onSignup(email.trim(), password, displayName.trim());
      } catch (err) {
        setError(friendlyAuthError(err));
      } finally {
        setBusy(false);
      }
    } else if (mode === "reset") {
      if (!email.trim()) {
        setError("Merci de renseigner votre e-mail.");
        return;
      }
      setBusy(true);
      try {
        await onReset(email.trim());
        setInfo("Un e-mail de réinitialisation a été envoyé si ce compte existe.");
      } catch (err) {
        setError(friendlyAuthError(err));
      } finally {
        setBusy(false);
      }
    }
  };

  const handleGuestClick = async () => {
    setError("");
    setBusy(true);
    try {
      await onGuest();
    } catch (err) {
      setError(friendlyAuthError(err));
    } finally {
      setBusy(false);
    }
  };

  const titles = {
    login: "Connexion agent",
    signup: "Créer un compte",
    reset: "Mot de passe oublié",
  };
  const subtitles = {
    login: "Réservé aux agents du département MAD-MAE.",
    signup: "Réservé aux agents du département MAD-MAE.",
    reset: "Recevez un lien pour réinitialiser votre mot de passe.",
  };

  return (
    <div className="max-w-sm mx-auto px-5 py-10">
      <div className="text-center mb-6">
        <h2 className="text-lg font-extrabold" style={{ color: BLUE_DEEP }}>
          {titles[mode]}
        </h2>
        <p className="text-sm text-slate-500 mt-1">{subtitles[mode]}</p>
      </div>

      <form
        onSubmit={handleSubmit}
        className="bg-white rounded-2xl border-2 border-[#1B4F8C]/15 shadow-sm p-5 space-y-4"
      >
        {mode === "signup" && (
          <div>
            <label className="block text-sm font-bold text-slate-700 mb-1">Nom complet</label>
            <input
              value={displayName}
              onChange={(e) => setDisplayName(e.target.value)}
              autoComplete="name"
              placeholder="Ex : Nourou Dine LOKA"
              className="w-full rounded-lg border-2 border-slate-200 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
            />
          </div>
        )}

        <div>
          <label className="block text-sm font-bold text-slate-700 mb-1">E-mail</label>
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            autoCapitalize="none"
            autoCorrect="off"
            autoComplete="email"
            className="w-full rounded-lg border-2 border-slate-200 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
          />
        </div>

        {mode !== "reset" && (
          <div>
            <label className="block text-sm font-bold text-slate-700 mb-1">Mot de passe</label>
            <input
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              autoComplete={mode === "signup" ? "new-password" : "current-password"}
              className="w-full rounded-lg border-2 border-slate-200 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
            />
          </div>
        )}

        {mode === "signup" && (
          <div>
            <label className="block text-sm font-bold text-slate-700 mb-1">Confirmer le mot de passe</label>
            <input
              type="password"
              value={confirmPassword}
              onChange={(e) => setConfirmPassword(e.target.value)}
              autoComplete="new-password"
              className="w-full rounded-lg border-2 border-slate-200 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
            />
          </div>
        )}

        {mode === "login" && (
          <button
            type="button"
            onClick={() => switchMode("reset")}
            className="text-sm font-semibold text-[#1B4F8C] hover:underline"
          >
            Mot de passe oublié ?
          </button>
        )}

        {error && <p className="text-sm text-rose-600 font-semibold">{error}</p>}
        {info && <p className="text-sm text-emerald-700 font-semibold">{info}</p>}

        <button
          type="submit"
          disabled={busy}
          className="w-full py-3.5 rounded-xl text-white font-extrabold text-base shadow-md disabled:opacity-60"
          style={{ background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` }}
        >
          {busy
            ? "Veuillez patienter..."
            : mode === "login"
            ? "Se connecter"
            : mode === "signup"
            ? "Créer mon compte"
            : "Envoyer le lien"}
        </button>

        <div className="text-center text-sm text-slate-500">
          {mode === "login" && (
            <>
              Pas encore de compte ?{" "}
              <button type="button" onClick={() => switchMode("signup")} className="font-semibold text-[#1B4F8C] hover:underline">
                Créer un compte
              </button>
            </>
          )}
          {mode !== "login" && (
            <button type="button" onClick={() => switchMode("login")} className="font-semibold text-[#1B4F8C] hover:underline">
              Retour à la connexion
            </button>
          )}
        </div>
      </form>

      <div className="flex items-center gap-3 my-5">
        <div className="h-px flex-1 bg-slate-200" />
        <span className="text-xs uppercase tracking-wide text-slate-400 font-semibold">ou</span>
        <div className="h-px flex-1 bg-slate-200" />
      </div>

      <button
        onClick={handleGuestClick}
        disabled={busy}
        className="w-full py-3.5 rounded-xl border-2 font-bold text-sm disabled:opacity-60"
        style={{ borderColor: BLUE_LIGHT, color: BLUE_DEEP }}
      >
        Utiliser sans compte (accès temporaire)
      </button>
      <p className="text-xs text-slate-400 text-center mt-2">
        Pour les personnes hors MAD-MAE souhaitant un usage ponctuel de l'application.
      </p>
    </div>
  );
}

function ParcAutocomplete({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [highlight, setHighlight] = useState(0);
  const wrapRef = useRef(null);

  const suggestions = useMemo(() => {
    const q = value.trim().toUpperCase();
    if (!q) return PARCS_LIST.slice(0, 8);
    const starts = PARCS_LIST.filter((p) => p.toUpperCase().startsWith(q));
    const contains = PARCS_LIST.filter(
      (p) => !p.toUpperCase().startsWith(q) && p.toUpperCase().includes(q)
    );
    return [...starts, ...contains].slice(0, 8);
  }, [value]);

  useEffect(() => {
    const handleOutside = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handleOutside);
    document.addEventListener("touchstart", handleOutside);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      document.removeEventListener("touchstart", handleOutside);
    };
  }, []);

  const select = (name) => {
    onChange(name);
    setOpen(false);
  };

  return (
    <div className="relative" ref={wrapRef}>
      <input
        value={value}
        onChange={(e) => {
          onChange(e.target.value);
          setOpen(true);
          setHighlight(0);
        }}
        onFocus={() => setOpen(true)}
        onKeyDown={(e) => {
          if (!open) return;
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setHighlight((h) => Math.min(h + 1, suggestions.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setHighlight((h) => Math.max(h - 1, 0));
          } else if (e.key === "Enter" && suggestions[highlight]) {
            e.preventDefault();
            select(suggestions[highlight]);
          } else if (e.key === "Escape") {
            setOpen(false);
          }
        }}
        placeholder="Ex : ZF, HOVAS, GTS..."
        autoComplete="off"
        className="w-full rounded-lg border-2 border-slate-200 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:border-[#1B4F8C]"
      />
      {open && suggestions.length > 0 && (
        <div className="absolute z-20 mt-1 w-full bg-white border-2 border-[#1B4F8C]/20 rounded-lg shadow-lg max-h-56 overflow-y-auto">
          {suggestions.map((p, i) => (
            <button
              type="button"
              key={p}
              onMouseDown={(e) => e.preventDefault()}
              onClick={() => select(p)}
              className="w-full text-left px-3 py-2.5 text-sm font-medium"
              style={i === highlight ? { background: "#EAF1FA", color: BLUE_DEEP } : { color: "#334155" }}
            >
              {p}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

        style={{ background: `linear-gradient(90deg, ${BLUE_DEEP}, ${BLUE_LIGHT})` }}
      >
        <RotateCcw size={18} /> Passer au parc suivant
      </button>

      {/* Rapport imprimable */}
      <div className="print-only mt-8">
        <div className="border-t-2 border-slate-300 pt-4 mb-4">
          <p className="text-xs text-slate-500">Rapport généré le {new Date().toLocaleString("fr-FR")}</p>
        </div>
        <ReportTable title="Trouvés sur MMTE" rows={foundList.map((f) => f.chassis)} />
        <ReportTable title="Enregistrés sur le parc (hors MMTE)" rows={registeredList.map((r) => r.chassis)} />
        <ReportTable title="Manquants (attendus sur MMTE, absents du parc)" rows={missingList.map((m) => m.chassis)} />
        <p className="text-xs text-slate-400 mt-6">Conception &amp; réalisation : Nourou Dine LOKA — Bénin Control / MAD-MAE</p>
      </div>
    </div>
  );
}

function ReportTable({ title, rows }) {
  if (rows.length === 0) return null;
  return (
    <div className="mb-6 break-inside-avoid">
      <h3 className="font-bold text-sm mb-2" style={{ color: BLUE_DEEP }}>
        {title} ({rows.length})
      </h3>
      <div className="grid grid-cols-2 gap-x-6 gap-y-1 text-xs font-plex-mono">
        {rows.map((r, i) => (
          <div key={i} className="border-b border-slate-100 py-0.5">
            {r}
          </div>
        ))}
      </div>
    </div>
  );
}

function SummaryCard({ label, value, tone, full }) {
  const tones = {
    navy: "text-white",
    emerald: "bg-emerald-600 text-white",
    sky: "bg-[#2E7DC1] text-white",
    rose: "bg-rose-600 text-white",
  };
  const style = tone === "navy" ? { background: BLUE_DEEP } : undefined;
  return (
    <div className={`rounded-xl p-4 ${tones[tone]} ${full ? "col-span-2" : ""}`} style={style}>
      <div className="text-3xl font-extrabold font-plex-mono leading-none">{value}</div>
      <div className="text-xs uppercase tracking-wide opacity-90 mt-1 font-semibold">{label}</div>
    </div>
  );
}
